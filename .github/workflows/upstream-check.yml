name: 核對上游 openlawtw 條文

# 檢查每月執行，例行回報只在 1、4、7、10 月。
#
# 為什麼不把 cron 直接設成一季一次：GitHub 在公開 repo 連續 60 天沒有
# repository 活動時會自動停用排程工作流程，且不發通知。季度（90 天）與
# 半年（180 天）的 cron 都會在觸發前被停用。因此改為每月執行（整輪約
# 三秒），由腳本決定何時發通知；每月更新一次條文核對日的 commit 同時
# 讓 repo 保持活動。

on:
  schedule:
    # 每月 5 日 03:17 UTC，台北時間 11:17。避開整點以減少排程延遲。
    - cron: '17 3 5 * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: upstream-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      REPORT_MONTHS: '1,4,7,10'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 逐條核對上游條文
        id: check
        run: node scripts/check-upstream.mjs

      - name: 寫入執行摘要
        if: always()
        run: cat upstream-report.md >> "$GITHUB_STEP_SUMMARY" || true

      - name: 有差異就開 issue
        if: steps.check.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TITLE: 條文核對有差異（${{ steps.check.outputs.verified_date }}，${{ steps.check.outputs.n_changed }} 條）
        run: |
          set -euo pipefail
          existing=$(gh issue list --state open --search "條文核對有差異 in:title" \
            --json number,title --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            echo "已有未結的核對 issue #$existing，補上本次結果"
            gh issue comment "$existing" --body-file upstream-report.md
          else
            gh issue create --title "$TITLE" --body-file upstream-report.md
          fi

      # 例行回報月份即使無變動也留一筆紀錄。集中在一個已關閉的「條文核對紀錄」
      # issue 裡留言，不會累積待處理事項，留言也不會把它重新開啟。
      - name: 例行回報月份留下無變動紀錄
        if: steps.check.outputs.routine == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LOG_TITLE: 條文核對紀錄
        run: |
          set -euo pipefail
          num=$(gh issue list --state all --search "$LOG_TITLE in:title" \
            --json number,title --jq "map(select(.title == \"$LOG_TITLE\")) | .[0].number // empty")
          if [ -z "$num" ]; then
            url=$(gh issue create --title "$LOG_TITLE" \
              --body '本 issue 收錄每次例行核對的結果，由排程自動留言。保持關閉狀態，有差異時會另開 issue。')
            num=${url##*/}
            gh issue close "$num"
          fi
          gh issue comment "$num" --body-file upstream-report.md

      - name: 條文一致就更新核對日
        if: steps.check.outputs.verified_bumped == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m "條文核對日更新為 ${{ steps.check.outputs.verified_date }}

          逐條比對 openlawtw@main，條文與上游現行內容一致，未變更任何條文文字。"
          git push
